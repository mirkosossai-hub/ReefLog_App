<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Reef Log</title>
<meta name="theme-color" content="#07131c">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<script src="chart.umd.min.js"></script>
<style>
:root{--bg:#07131c;--card:#0f2230;--card2:#14303f;--line:#1f4153;--tx:#e6f1f6;--mut:#8aa7b6;--acc:#2ec4d6;--ok:#3fcf8e;--warn:#f4b942;--bad:#ef5d5d;--ca:#5aa9ff;--kh:#f08c3a;--mg:#b07cf2}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;background:linear-gradient(180deg,#07131c 70%,#07131c00);padding:calc(env(safe-area-inset-top) + 12px) 16px 10px;display:flex;align-items:center;gap:10px}
header h1{font-size:19px;margin:0;font-weight:700;letter-spacing:.3px}
header .sub{color:var(--mut);font-size:12px;margin-left:auto;text-align:right}
main{padding:0 12px calc(88px + env(safe-area-inset-bottom));max-width:720px;margin:0 auto}
nav{position:fixed;bottom:0;left:0;right:0;z-index:6;display:flex;background:#0b1b26;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;border:0;color:var(--mut);padding:9px 0 8px;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:3px}
nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8}
nav button.on{color:var(--acc)}
nav{justify-content:center}nav button{max-width:144px}
nav button.plus span{display:flex;align-items:center;justify-content:center;width:50px;height:50px;border-radius:50%;background:var(--acc);margin-top:-22px;box-shadow:0 4px 14px #0008;border:4px solid #0b1b26}
nav button.plus svg{stroke:#04222a;stroke-width:2.6;width:24px;height:24px}
#sheet{position:fixed;inset:0;z-index:15;background:#000a;display:flex;align-items:center;justify-content:center;padding:16px}
#sheet.hide{display:none}
#sheet .pane{background:var(--card);border:1px solid var(--line);border-radius:18px;width:100%;max-width:440px;padding:16px;box-shadow:0 12px 40px #000a;animation:pop .15s ease-out}
@keyframes pop{from{transform:scale(.94);opacity:0}to{transform:none;opacity:1}}
#sheet .acts{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
#sheet .acts button{background:var(--card2);border:1px solid var(--line);border-radius:14px;color:var(--tx);padding:12px 4px;font:inherit;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:6px}
#sheet .acts button i{font-style:normal;font-size:24px}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:3px;margin:10px 0}
.seg button{flex:1;background:none;border:0;color:var(--mut);padding:8px 4px;border-radius:9px;font:inherit;font-size:14px}
.seg button.on{background:var(--acc);color:#04222a;font-weight:700}
.mitem{display:flex;align-items:center;gap:12px;padding:14px;background:var(--card);border:1px solid var(--line);border-radius:14px;margin:8px 0;cursor:pointer}
.mitem i{font-style:normal;font-size:22px;width:40px;height:40px;border-radius:11px;background:var(--card2);display:flex;align-items:center;justify-content:center;flex:none}
.mitem .t{flex:1}.mitem .t b{display:block}.mitem .t span{font-size:12px;color:var(--mut)}
.back{display:flex;align-items:center;gap:8px;margin:6px 0 2px}
.back button{background:none;border:0;color:var(--acc);font:inherit;font-size:15px;padding:6px 0}
.back h1{font-size:18px;margin:0 0 0 auto;font-weight:700}
.bub{padding:10px 12px;border-radius:14px;margin:8px 0;max-width:88%;font-size:14.5px;line-height:1.5;word-wrap:break-word}.bub p{margin:4px 0}.bub ul{margin:4px 0;padding-left:18px}.bub.me{background:var(--acc);color:#04222a;margin-left:auto;border-bottom-right-radius:4px;white-space:pre-wrap}.bub.ai{background:var(--card);border:1px solid var(--line);border-bottom-left-radius:4px}.tchip{font-size:11px;color:var(--mut);margin:2px 0 2px 4px}
.guide{font-size:15px;line-height:1.55}.guide p{margin:8px 0}.guide ul,.guide ol{margin:6px 0;padding-left:20px}.guide li{margin:5px 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0}
.card h2{font-size:14px;margin:0 0 10px;color:var(--mut);font-weight:600;text-transform:uppercase;letter-spacing:.6px;display:flex;align-items:center;gap:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
.tile{background:var(--card2);border-radius:11px;padding:9px 10px;border-left:4px solid var(--line)}
.tile .k{font-size:12px;color:var(--mut)}
.tile .v{font-size:21px;font-weight:700;margin-top:1px}
.tile .v small{font-size:11px;color:var(--mut);font-weight:500}
.tile .d{font-size:11px;color:var(--mut)}
.s-ok{border-left-color:var(--ok)}.s-warn{border-left-color:var(--warn)}.s-bad{border-left-color:var(--bad)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.f{display:flex;flex-direction:column;gap:3px;flex:1;min-width:92px}
.f label{font-size:12px;color:var(--mut)}
input,select,textarea{background:#0a1a24;border:1px solid var(--line);color:var(--tx);border-radius:9px;padding:9px 10px;font:inherit;width:100%}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--acc)}
textarea{min-height:60px;resize:vertical}
.btn{background:var(--acc);color:#04222a;border:0;border-radius:10px;padding:11px 16px;font:inherit;font-weight:700}
.btn.sec{background:var(--card2);color:var(--tx);border:1px solid var(--line);font-weight:600}
.btn.sm{padding:6px 10px;font-size:13px}
.btn.danger{background:#3a1717;color:#ffb4b4;border:1px solid #5a2323}
.btn:disabled{opacity:.5}
.list .it{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--line);align-items:flex-start}
.list .it:first-child{border-top:0}
.it .when{min-width:58px;color:var(--mut);font-size:12px}
.it .body{flex:1;font-size:14px}
.it .acts{display:flex;gap:6px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chip{background:var(--card2);border:1px solid var(--line);color:var(--tx);border-radius:999px;padding:6px 12px;font-size:13px}
.chip.on{background:var(--acc);color:#04222a;border-color:var(--acc);font-weight:700}
.mut{color:var(--mut)}.small{font-size:12px}
.banner{background:#33270b;border:1px solid #6b5212;color:#ffd98a;border-radius:10px;padding:9px 12px;font-size:13px;margin:8px 0}
.tri{display:grid;grid-template-columns:auto 1fr 1fr 1fr;gap:6px 10px;font-size:13px;align-items:center}
.tri .h{color:var(--mut);font-size:11px;text-transform:uppercase}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:6px}
.big{font-size:16px;font-weight:700}
.toast{z-index:30!important;position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom));background:#e6f1f6;color:#07131c;padding:9px 16px;border-radius:999px;font-size:14px;font-weight:600;z-index:9;opacity:0;transition:.25s;pointer-events:none}
.toast.on{opacity:1}
canvas{max-width:100%}
.hide{display:none!important}
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.pgrid .ph{position:relative;aspect-ratio:1;border-radius:9px;overflow:hidden;background:#0a1a24;border:2px solid transparent;padding:0}
.pgrid .ph img{width:100%;height:100%;object-fit:cover;display:block}
.pgrid .ph span{position:absolute;left:0;right:0;bottom:0;font-size:10px;line-height:1.3;padding:14px 5px 4px;background:linear-gradient(0deg,#000d 55%,#0000);color:#fff;text-align:left}
.pgrid .ph span em{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-style:normal;font-size:11px}
.pgrid .ph.sel{border-color:var(--acc)}
.pgrid .ph b{position:absolute;top:4px;right:4px;background:var(--acc);color:#04222a;border-radius:50%;width:20px;height:20px;font-size:12px;display:flex;align-items:center;justify-content:center}
.ov{position:fixed;inset:0;z-index:20;background:#03080c;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top) + 8px) 10px calc(env(safe-area-inset-bottom) + 10px)}
.ov .top{display:flex;align-items:center;gap:8px;color:#fff;padding:4px 2px 8px}
.ov .stage{flex:1;position:relative;display:flex;align-items:center;justify-content:center;min-height:0}
.ov .stage img{max-width:100%;max-height:100%;object-fit:contain;border-radius:8px}
.ov .cmp{position:relative;max-width:100%;max-height:100%}
.ov .cmp img{display:block;max-width:100%;max-height:70vh}
.ov .cmp .b{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ov .cmp .line{position:absolute;top:0;bottom:0;width:2px;background:#fff;box-shadow:0 0 6px #000}
.ov .lbl{position:absolute;top:6px;font-size:11px;background:#0009;color:#fff;padding:2px 7px;border-radius:999px}
.ov .nav{position:absolute;top:50%;transform:translateY(-50%);background:#0007;color:#fff;border:0;border-radius:50%;width:42px;height:42px;font-size:22px}
.tag{font-size:11px;padding:2px 7px;border-radius:999px;background:var(--card2);color:var(--mut);border:1px solid var(--line)}
details summary{cursor:pointer;color:var(--acc);font-size:14px;margin:4px 0}
hr{border:0;border-top:1px solid var(--line);margin:12px 0}
</style>
</head>
<body>
<header>
  <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#2ec4d6" stroke-width="1.8"><path d="M3 18c3-2 6 2 9 0s6 2 9 0"/><path d="M8 15V9a2 2 0 1 1 4 0v6M12 12V6a2 2 0 1 1 4 0v9"/></svg>
  <h1 id="hdrTitle">Reef Log</h1>
  <div class="sub" id="hdrSub"></div>
  <button id="helpBtn" aria-label="Guida" style="background:var(--card2);border:1px solid var(--line);color:var(--acc);width:34px;height:34px;border-radius:50%;font:700 17px system-ui;flex:none;margin-left:6px">?</button>
</header>
<main id="app"></main>
<nav id="nav">
  <button data-v="home" class="on"><svg viewBox="0 0 24 24"><path d="M3 11 12 4l9 7v9H3z"/></svg>Home</button>
  <button data-v="param"><svg viewBox="0 0 24 24"><path d="M9 3h6M10 3v6L5 19a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2l-5-10V3"/></svg>Parametri</button>
  <button data-v="plus" class="plus" aria-label="Aggiungi"><span><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></span></button>
  <button data-v="vasca"><svg viewBox="0 0 24 24"><path d="M3 12c3-4 7-5 11-2l4-3v10l-4-3c-4 3-8 2-11-2z"/><circle cx="8" cy="11" r=".8"/></svg>Vasca</button>
  <button data-v="menu"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg>Menu</button>
</nav>
<div id="sheet" class="hide"></div>
<div class="toast" id="toast"></div>
<input type="file" id="fileIn" accept="application/json,.json" class="hide">
<input type="file" id="photoIn" accept="image/*" multiple class="hide">
<input type="file" id="lvPhotoIn" accept="image/*" class="hide">
<input type="file" id="aiPhotoIn" accept="image/*" class="hide">
<input type="file" id="testPhotoIn" accept="image/*" class="hide">
<div id="ov" class="ov hide"></div>

<script>
"use strict";
const LOCAL_ONLY=/*LOCAL_ONLY*/true; // true nella versione app Android (nessuna sincronizzazione online)
const CAP=()=>window.Capacitor&&window.Capacitor.isNativePlatform&&window.Capacitor.isNativePlatform()?window.Capacitor:null;
/* ---------- Parametri ---------- */
const P = {
  kh:  {n:'KH',        u:'dKH', d:2, t:[7.5,9]},
  ca:  {n:'Calcio',    u:'ppm', d:0, t:[400,450]},
  mg:  {n:'Magnesio',  u:'ppm', d:0, t:[1250,1400]},
  no3: {n:'Nitrati',   u:'ppm', d:1, t:[2,10]},
  po4: {n:'Fosfati',   u:'ppm', d:3, t:[0.03,0.1]},
  den: {n:'Densità',   u:'',    d:3, t:[1.024,1.026]},
  ph:  {n:'pH',        u:'',    d:2, t:[7.9,8.4]},
  temp:{n:'Temp.',     u:'°C',  d:1, t:[24,26.5]},
  k:   {n:'Potassio',  u:'ppm', d:0, t:[380,420]},
  nh4: {n:'Ammoniaca', u:'ppm', d:2, t:[0,0.05]},
  no2: {n:'Nitriti',   u:'ppm', d:2, t:[0,0.05]},
};
const TRI = ['ca','kh','mg'];
const TRI_COL = {ca:'#5aa9ff',kh:'#f08c3a',mg:'#b07cf2'};
const DAY = 86400000;
const DEF_SETTINGS = {
  volume: 50,
  mode: 'balling',
  aio: {ca:'', kh:'', mg:''},
  conc: {ca:19.5, kh:1.0, mg:''},
  salt: {ca:'', kh:'', mg:''},
  targets: {},
  showParams: ['kh','ca','mg','no3','po4','den','ph','temp'],
  startDate: '', startDays: 28, bacterPer250: 5, bactName: 'Bacter Mix + Bacter Nitrix', tdsMax: 3,
};

/* ---------- Stato ---------- */
const COLLS=['tests','doses','events','tasks','livestock','stock','gear'];
const S = {tests:[], doses:[], events:[], tasks:[], livestock:[], stock:[], gear:[], lvPhotos:{}, settings:clone(DEF_SETTINGS), mode:'local', ready:false, stale:false};
let editTask = null, doneOpen = null, testPrefill = null;
let view = 'home', editTest = null, grafParam = 'kh', grafRange = 90, confirmKey = null;
const charts = {};

function clone(o){return JSON.parse(JSON.stringify(o))}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
function num(v){ if(v===''||v==null) return null; const n = typeof v==='number'?v:parseFloat(String(v).replace(',','.')); return isFinite(n)?n:null }
function fmt(v,d){ if(v==null||!isFinite(v)) return '–'; return v.toLocaleString('it-IT',{minimumFractionDigits:0,maximumFractionDigits:d}) }
function fdate(ts,y){ return new Date(ts).toLocaleDateString('it-IT',y?{day:'2-digit',month:'short',year:'2-digit'}:{day:'2-digit',month:'short'}) }
function ftime(ts){ return new Date(ts).toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'}) }
function toInput(ts){ const d=new Date(ts); d.setMinutes(d.getMinutes()-d.getTimezoneOffset()); return d.toISOString().slice(0,16) }
function fromInput(s){ const t = new Date(s).getTime(); return isFinite(t)?t:Date.now() }
function esc(s){ return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])) }
function tgt(p){ const t=S.settings.targets?.[p]; return (t&&t.length===2&&num(t[0])!=null&&num(t[1])!=null)?[num(t[0]),num(t[1])]:P[p].t }
function vol(){ return num(S.settings.volume)||50 }
function toast(m){ const t=document.getElementById('toast'); t.textContent=m; t.classList.add('on'); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('on'),1900) }
const byTs = (a,b)=>a.ts-b.ts;

/* ---------- Storage (db del Claude artifact, fallback locale) ---------- */
let DB=null, UID=null, base=null;
// Più vasche (Pro, solo app): ogni vasca ha il suo archivio; la principale usa la chiave storica
const MULTI=LOCAL_ONLY;
function tanks(){ let t=[]; try{ t=JSON.parse(localStorage.getItem('reeflog.tanks')||'[]')||[] }catch(e){} if(!t.some(x=>x.id==='main')) t.unshift({id:'main',name:'Vasca principale'}); return t }
function saveTanks(t){ try{ localStorage.setItem('reeflog.tanks',JSON.stringify(t)) }catch(e){} }
function curTank(){ if(!MULTI) return 'main'; let c=null; try{ c=localStorage.getItem('reeflog.curTank') }catch(e){} return (c&&tanks().some(x=>x.id===c)&&(c==='main'||lsProOk()))?c:'main' }
function lsProOk(){ try{ return localStorage.getItem('reeflog.pro')==='1' }catch(e){ return false } }
function tankKey(id){ return id==='main'?'reeflog.v1':'reeflog.v1.'+id }
function tankName(id){ const t=tanks().find(x=>x.id===(id||curTank())); return t?t.name:'Vasca' }
function lastBackup(){ try{ return +localStorage.getItem('reeflog.lastBackup')||0 }catch(e){ return 0 } }
function snoozeBackup(){ try{ localStorage.setItem('reeflog.lastBackup',Date.now()) }catch(e){} }
function backupDue(){ return (S.tests.length+S.doses.length+S.events.length)>0 && Date.now()-lastBackup()>14*DAY }
function lsLoad(){ for(const c of COLLS) S[c]=[]; S.settings=clone(DEF_SETTINGS); try{ const j=JSON.parse(localStorage.getItem(tankKey(curTank()))||'null'); if(j){ for(const c of COLLS) S[c]=j[c]||[]; S.settings=Object.assign(clone(DEF_SETTINGS),j.settings||{}) } }catch(e){} }
function lsSave(){ try{ localStorage.setItem(tankKey(curTank()),JSON.stringify(Object.assign(Object.fromEntries(COLLS.map(c=>[c,S[c]])),{settings:S.settings}))) }catch(e){} }

async function saveItem(coll,item){
  if(S.mode==='db'){
    try{ await base.collection(coll).doc(item.id).set(item) }
    catch(e){ handleErr(e); return false }
  }else{
    const arr=S[coll]; const i=arr.findIndex(x=>x.id===item.id); if(i>=0) arr[i]=item; else arr.push(item); lsSave(); enqueue(coll,item.id,'put'); render();
  }
  if(coll==='tasks') scheduleNotif();
  return true;
}
async function delItem(coll,id){
  if(S.mode==='db'){ try{ await base.collection(coll).doc(id).delete() }catch(e){ handleErr(e) } }
  else{ S[coll]=S[coll].filter(x=>x.id!==id); lsSave(); enqueue(coll,id,'del'); render() }
  if(coll==='tasks') scheduleNotif();
}
async function saveSettings(){
  if(S.mode==='db'){ try{ await DB.doc(`data/users/${UID}/settings`).set(clone(S.settings)) }catch(e){ handleErr(e); return } }
  else{ lsSave(); enqueue('settings','main','put') }
  render(); scheduleNotif();
}
function handleErr(e){
  const c=e&&e.code;
  if(c==='quota_exceeded') toast('Spazio dati esaurito: esporta un backup');
  else if(c==='unavailable') toast('Connessione assente, riprova');
  else toast('Salvataggio non riuscito');
}

async function initStore(){
  lsLoad(); S.ready=true; render();
  try{
    if(!window.claude||!window.claude.use) return;
    const [db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
    const id = user ? await user.id() : null;
    if(!db||!id){ render(); return }
    DB=db; UID=id; base=db.doc(`data/users/${id}/main`); S.mode='db';
    for(const c of COLLS) S[c]=[]; S.settings=clone(DEF_SETTINGS); S.stale=true;
    const pending=new Set([...COLLS,'settings']);
    const timer=setTimeout(()=>{ if(pending.size){ S.stale=true; toast('Dati non ancora raggiungibili…'); render() } },10000);
    const done=(k,snap)=>{ if(!snap.metadata.fromCache){ pending.delete(k); if(!pending.size){ clearTimeout(timer); S.stale=false } } };
    for(const c of COLLS){
      base.collection(c).onSnapshot(snap=>{ S[c]=snap.docs.map(d=>clone(d.data())); done(c,snap); scheduleRender() },
        e=>{ pending.delete(c); handleErr(e) });
    }
    db.doc(`data/users/${id}/settings`).onSnapshot(snap=>{
      if(snap.exists) S.settings=Object.assign(clone(DEF_SETTINGS),clone(snap.data()));
      done('settings',snap); scheduleRender()
    },e=>{ pending.delete('settings'); handleErr(e) });
    render();
  }catch(e){ render() }
}
let _rq=false; function scheduleRender(){ if(_rq) return; _rq=true; requestAnimationFrame(()=>{ _rq=false; if(!isTyping()) render(); else _pendingRender=true }) }
let _pendingRender=false;
function isTyping(){ const a=document.activeElement; return a && (a.tagName==='INPUT'||a.tagName==='TEXTAREA'||a.tagName==='SELECT') && a.closest('form') }
document.addEventListener('focusout',()=>{ setTimeout(()=>{ if(_pendingRender && !isTyping()){ _pendingRender=false; render() } },50) });

/* ---------- Calcoli triade ---------- */
function dmode(){ return S.settings.mode||'balling' }
function isAIO(){ return dmode()==='aio' }
function isReactor(){ return dmode()==='reactor' }
const CA_PER_DKH=7.15; // ppm di calcio per 1 dKH (stessa quantità di meq)
function valAt(p,ts){ // valore stimato del parametro in vasca a una certa data (interpolato dai test)
  const T=testsWith(p); if(!T.length){ const [lo,hi]=tgt(p); return (lo+hi)/2 }
  if(ts<=T[0].ts) return num(T[0].v[p]); if(ts>=T[T.length-1].ts) return num(T[T.length-1].v[p]);
  for(let i=1;i<T.length;i++) if(ts<=T[i].ts){ const a=T[i-1],b=T[i]; return num(a.v[p])+(num(b.v[p])-num(a.v[p]))*(ts-a.ts)/(b.ts-a.ts) }
}
function ballEff(p){ // aumento del parametro (unità parametro · L) per ml di soluzione Balling
  const c=num(S.settings.conc?.[p]); if(c==null||c<=0) return null;
  return p==='kh' ? c*2.8 : c; // KH: meq/ml → dKH·L (1 meq/L = 2,8 dKH)
}
function aioEff(p){ // AIO: "1 ml in 100 L alza di X" → X·100 (unità·L per ml)
  const c=num(S.settings.aio?.[p]); if(c==null||c<=0) return null; return c*100;
}
function effPerMl(p){ return isAIO()? aioEff(p) : ballEff(p) }
function testsWith(p){ return S.tests.filter(t=>num(t.v?.[p])!=null).sort(byTs) }
function regimens(){ return [...S.doses].sort(byTs) }
function curReg(ts){ let r=null; for(const d of regimens()){ if(d.ts<=ts) r=d; else break } return r }
// ml/g del prodotto che fornisce p secondo la modalità attuale
function rateAt(p,ts){ const r=curReg(ts); if(!r) return 0; if(isAIO()) return r.kind==='aio'?(num(r.aio)||0):0; if(isReactor()) return r.kind==='reactor'?(num(r.flow)||0):0; return (r.kind==='aio'||r.kind==='reactor')?0:(num(r[p])||0) }
function reactorAdd(rec,p,ts){ // apporto giornaliero del reattore (unità·L/giorno); null se mancano dati
  const Ld=(num(rec.flow)||0)*1.44; // ml/min → L/giorno
  if(p==='mg'){ const ml=num(rec.mg)||0; if(!ml) return 0; const e=ballEff('mg'); return e==null?null:ml*e }
  const ek=num(rec.effKH); if(!Ld) return 0; if(ek==null) return null;
  if(p==='kh') return Ld*(ek-valAt('kh',ts));
  const ec=num(rec.effCa); if(ec!=null) return Ld*(ec-valAt('ca',ts));
  return Ld*(ek-valAt('kh',ts))*CA_PER_DKH;
}
// effetto di un record (regime → per giorno, evento → totale) sul parametro p; null se manca la concentrazione
function recEffect(rec,p,ts){
  if(rec.kind==='reactor'){ const a=reactorAdd(rec,p,ts??rec.ts); return {ml:p==='mg'?(num(rec.mg)||0):(num(rec.flow)||0)*1.44,eff:a} }
  if(rec.kind==='aio'){ const ml=num(rec.aio)||0; if(!ml) return {ml:0,eff:0}; const e=aioEff(p); return {ml,eff:e==null?null:ml*e} }
  const ml=num(rec[p])||0; if(!ml) return {ml:0,eff:0}; const e=ballEff(p); return {ml,eff:e==null?null:ml*e};
}
function addedBetween(p,t1,t2){ // ritorna {ml, add (unità·L) | null}
  const R=regimens(); let ml=0, add=0, ok=true;
  for(let i=0;i<R.length;i++){
    const s=R[i].ts, e=i+1<R.length?R[i+1].ts:Infinity;
    const ov=Math.min(e,t2)-Math.max(s,t1);
    if(ov>0){ const r=recEffect(R[i],p,(Math.min(e,t2)+Math.max(s,t1))/2); ml+=r.ml*ov/DAY; if(r.eff==null) ok=false; else add+=r.eff*ov/DAY }
  }
  for(const ev of S.events) if(ev.type==='dose' && ev.ts>t1 && ev.ts<=t2){ const r=recEffect(ev,p); ml+=r.ml; if(r.eff==null) ok=false; else add+=r.eff }
  return {ml, add: ok?add:null};
}
function intervals(p){
  const T=testsWith(p), V=vol(), out=[];
  for(let i=1;i<T.length;i++){
    const a=T[i-1], b=T[i], days=(b.ts-a.ts)/DAY; if(days<0.25) continue;
    const c1=num(a.v[p]), c2=num(b.v[p]);
    const ab=addedBetween(p,a.ts,b.ts), ml=ab.ml;
    const added = ab.add!=null ? ab.add/V : null;
    let wc=0; const sn=num(S.settings.salt?.[p]);
    for(const ev of S.events){
      if(ev.type!=='wc'||!(ev.ts>a.ts&&ev.ts<=b.ts)) continue;
      const L=num(ev.liters); if(!L) continue;
      if(sn!=null){ const ci=c1+(c2-c1)*(ev.ts-a.ts)/(b.ts-a.ts); wc+=(L/V)*(sn-ci) }
    }
    const cons = added!=null ? (c1+added+wc-c2)/days : null;
    out.push({t1:a.ts,t2:b.ts,days,c1,c2,ml,added,wc,cons,mid:(a.ts+b.ts)/2});
  }

}
function avgCons(p,daysBack=30){
  const I=intervals(p).filter(x=>x.cons!=null); if(!I.length) return null;
  const last=I[I.length-1].t2, from=last-daysBack*DAY;
  let w=0,s=0; for(const x of I){ const ov=Math.min(x.t2,last)-Math.max(x.t1,from); if(ov>0){ s+=x.cons*ov; w+=ov } }
  return w? s/w : I[I.length-1].cons;
}
function lastVal(p){ const T=testsWith(p); return T.length?{v:num(T[T.length-1].v[p]),ts:T[T.length-1].ts, prev:T.length>1?num(T[T.length-2].v[p]):null}:null }
function status(p,v){ const [lo,hi]=tgt(p); if(v==null) return ''; if(v>=lo&&v<=hi) return 's-ok'; const span=(hi-lo)||Math.abs(hi)||1; return (v<lo-span*0.5||v>hi+span*0.5)?'s-bad':'s-warn' }

function day0(ts){ const d=new Date(ts); d.setHours(0,0,0,0); return d.getTime() }
function addDays(ts,n){ const d=new Date(ts); d.setDate(d.getDate()+n); return d.getTime() }
function nextDue(t){
  const today=day0(Date.now());
  if(t.kind==='interval'){ const ev=Math.max(1,num(t.every)||7); return t.lastDone? addDays(day0(t.lastDone),ev) : today }
  const days=[...new Set((t.days||[]).map(Number).filter(d=>d>=1&&d<=31))].sort((a,b)=>a-b); if(!days.length) return today;
  const after = t.lastDone? day0(t.lastDone) : addDays(today,-1);
  const a=new Date(after);
  for(let k=0;k<4;k++){ const y=a.getFullYear(), m=a.getMonth()+k, last=new Date(y,m+1,0).getDate();
    for(const d of days){ const ts=new Date(y,m,Math.min(d,last)).getTime(); if(ts>after) return ts } }
  return today;
}
function dueDiff(t){ return Math.round((nextDue(t)-day0(Date.now()))/DAY) }

  if(d<0) return `<span class="tag" style="background:#3a1717;color:#ffb4b4;border-color:#5a2323">scaduta da ${-d} gg</span>`;
  if(d===0) return `<span class="tag" style="background:#33270b;color:#ffd98a;border-color:#6b5212">oggi</span>`;
  if(d===1) return `<span class="tag" style="color:#ffd98a">domani</span>`;
  return `<span class="tag">${fdate(nextDue(t))} · tra ${d} gg</span>` }
function taskEveryDays(t){ return t.kind==='interval'? Math.max(1,num(t.every)||7) : 30/Math.max(1,(t.days||[]).length) }
function cadence(t){ return t.kind==='interval'? `ogni ${num(t.every)||7} giorni` : `il ${(t.days||[]).join(' e il ')} di ogni mese` }

function startMode(){ return S.settings.startMode || (S.settings.startDate?'fixed':'none') }

function startInfo(){
  const mode=startMode(); if(mode==='none') return null;
  const sd=S.settings.startDate; if(!sd) return null; const st=day0(new Date(sd+'T00:00').getTime()); if(!isFinite(st)) return null;
  const day=Math.floor((day0(Date.now())-st)/DAY)+1, week=Math.ceil(day/7);

    const T=S.tests.filter(t=>t.ts>=st&&num(t.v?.nh4)!=null&&num(t.v?.no2)!=null).sort(byTs); let end=null;
    for(let i=1;i<T.length;i++){ const z=t=>num(t.v.nh4)<=0.02&&num(t.v.no2)<=0.02; if(z(T[i-1])&&z(T[i])){ end=T[i].ts; break } }

async function saveFile(fn,data,mime){
  const C=CAP(); const plug=n=>C&&((C.Plugins&&C.Plugins[n])||(C.registerPlugin&&C.registerPlugin(n))); const FS=plug('Filesystem'), SH=plug('Share');
  if(FS&&SH){ try{ let w; if(data instanceof Blob){ const b64=await new Promise(res=>{ const fr=new FileReader(); fr.onload=()=>res(String(fr.result).split(',')[1]); fr.readAsDataURL(data) }); w=await FS.writeFile({path:fn,data:b64,directory:'CACHE'}) } else w=await FS.writeFile({path:fn,data,directory:'CACHE',encoding:'utf8'}); await SH.share({title:fn,files:[w.uri],dialogTitle:'Salva o invia '+fn}); return 'shared' }catch(err){ if(/cancel/i.test(String(err&&err.message))) return 'abort'; console.warn(err) } }
  try{ const dl=window.claude?.use? await window.claude.use('downloads'):null; if(dl){ await dl.save({filename:fn,data}); return 'saved' } }catch(err){}

}

function buildIcs(){

  const stamp=new Date().toISOString().replace(/[-:]/g,'').slice(0,15)+'Z';
  const ev=(id,ts,rule,t)=>{ const desc=t.bacter?bacterTxt():''; L.push('BEGIN:VEVENT','UID:'+id+'@reeflog','DTSTAMP:'+stamp,'DTSTART;VALUE=DATE:'+icsDate(ts),'DTEND;VALUE=DATE:'+icsDate(addDays(ts,1)),'RRULE:'+rule,'SUMMARY:'+icsEsc('🐠 '+t.name));
    if(desc) L.push('DESCRIPTION:'+icsEsc(desc)); L.push('BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+icsEsc(t.name),'TRIGGER:PT9H','END:VALARM','END:VEVENT') };
  for(const t of S.tasks){
    if(t.kind==='interval') ev(t.id,nextDue(t),'FREQ=DAILY;INTERVAL='+Math.max(1,num(t.every)||7),t);

    const [c,t]= st==='s-ok'?[[40,150,80],'nel range']:st==='s-warn'?[[200,140,0],'attenzione']:[[200,50,50],'fuori range']; doc.setTextColor(...c); doc.text(t,M+155,y); doc.setTextColor(30); y+=6 }

const STOCK_T={aio:['All In One','ml'],ca:['Balling Calcio','ml'],kh:['Balling KH','ml'],mg:['Balling Magnesio','ml'],salt:['Sale','kg'],reagent:['Reagente test','test'],other:['Altro','pz']};
const STOCK_UNITS=['pz','ml','L','g','kg','mg'];
function stU(it){ return it.type==='other'?(STOCK_UNITS.includes(it.unit)?it.unit:'pz'):(STOCK_T[it.type]||STOCK_T.other)[1] }
let stockEdit=null;
function stockUsed(it,t1,t2){
  if(t2<=t1) return 0; let u=0;
  if(it.type==='aio'||['ca','kh','mg'].includes(it.type)){
    const R=regimens();
    for(let i=0;i<R.length;i++){ const s=R[i].ts, e=i+1<R.length?R[i+1].ts:Infinity, ov=Math.min(e,t2)-Math.max(s,t1); if(ov<=0) continue;
      const r=R[i]; const ml= it.type==='aio' ? (r.kind==='aio'?num(r.aio)||0:0) : (r.kind==='balling'||!r.kind ? num(r[it.type])||0 : (r.kind==='reactor'&&it.type==='mg'?num(r.mg)||0:0)); u+=ml*ov/DAY }
    for(const ev of S.events) if(ev.type==='dose'&&ev.ts>t1&&ev.ts<=t2) u+= it.type==='aio' ? (ev.kind==='aio'?num(ev.aio)||0:0) : (ev.kind!=='aio'?num(ev[it.type])||0:0);
    return u;
  }
  if(it.type==='salt'){ const g=num(it.saltGL)||36; for(const ev of S.events) if(ev.type==='wc'&&ev.ts>t1&&ev.ts<=t2) u+=(num(ev.liters)||0)*g/1000; return u }
  if(it.type==='reagent'){ for(const t of S.tests) if(t.ts>t1&&t.ts<=t2&&num(t.v?.[it.param])!=null) u++; return u }
  if(it.type==='other'&&it.task&&num(it.per)){ const tk=S.tasks.find(x=>x.id===it.task); for(const ev of S.events) if(ev.type==='maint'&&ev.ts>t1&&ev.ts<=t2&&(ev.task===it.task||(!ev.task&&tk&&ev.note===tk.name))) u+=num(it.per); return u }
  return 0;
}
function stockInfo(it){
  const now=Date.now(), used=stockUsed(it,it.setTs||now,now), rem=Math.max(0,(num(it.qty)||0)-used);
  // ritmo di consumo: storico degli ultimi 30 giorni (o dall'inizio dei dati, se più recente)
  const first=Math.min(...[...S.tests,...S.events,...S.doses].map(x=>x.ts).filter(Boolean),now), from=Math.max(now-30*DAY,first), span=(now-from)/DAY; let rate=span>=3?stockUsed(it,from,now)/span:0;
  if(!rate&&['aio','ca','kh','mg'].includes(it.type)){ const r=curReg(now); if(r) rate= it.type==='aio'?(r.kind==='aio'?num(r.aio)||0:0):(r.kind!=='aio'&&r.kind!=='reactor'?num(r[it.type])||0:0) }
  if(!rate&&it.type==='other'&&it.task&&num(it.per)){ const tk=S.tasks.find(x=>x.id===it.task); if(tk) rate=num(it.per)/taskEveryDays(tk) }
  const days= rate>0? rem/rate : null;
  const exp=num(it.expiry), expDays= exp? Math.floor((exp-now)/DAY) : null;
  return {rem,rate,days,expDays};
}

  return `Sei l'assistente di Reef Log, un'app italiana per la gestione di acquari marini (reef). Rispondi sempre in italiano, in modo chiaro e conciso, adatto allo schermo di un telefono: frasi brevi, elenchi quando servono, niente tabelle larghe.

Come calcola l'app: il consumo giornaliero tra due test consecutivi = (valore iniziale + quanto dosato + effetto dei cambi d'acqua − valore finale) / giorni. Con l'All In One un solo prodotto apporta Ca, KH e Mg in proporzioni fisse. Con il reattore di calcio l'apporto = portata × (valore effluente − valore in vasca).
Prudenza: suggerisci correzioni graduali (KH non oltre circa 1 dKH al giorno, calcio e magnesio a step), segnala quando un valore sembra un errore di misura, e per problemi seri (morie, valori estremi) consiglia di verificare con un secondo test o un negoziante esperto.
Azioni: puoi proporre di aggiungere una nota, una scadenza, un test letto da una foto o di modificare la dose usando gli strumenti dedicati. L'utente vedrà una richiesta di conferma: proponi un'azione solo quando è utile o richiesta, e spiega prima il perché.

RIEPILOGO DELLA VASCA (aggiornato ora):
${aiOverview()}`;
}

  const lt=lastEv('tds'); if(lt) o.push(`Osmosi: ultimo TDS ${lt.tds} ppm.`);
  return o.join('\n');

function aiTrim(msgs){ // mantiene la conversazione entro un limite, partendo sempre da un messaggio utente "pulito"

async function aiSend(){

  AI.msgs.push({role:'user',content,_img:AI.pendingImg?AI.pendingImg.thumb:null}); AI.pendingImg=null; AI.draft=''; AI.error=''; AI.busy=true; render();

      AI.msgs.push({role:'assistant',content:res.content}); render();
      if(res.stop_reason!=='tool_use') break;
      const results=[];
      for(const b of res.content.filter(b=>b.type==='tool_use')){
        let out;
        if(AI_ACTIONS.has(b.name)){
          const ok=await new Promise(resolve=>{ AI.confirm={name:b.name,input:b.input,resolve}; render() });
          AI.confirm=null; AI.dec[b.id]=ok?1:0; render();

        }else{ try{ out=aiRead(b.name,b.input||{}) }catch(e){ out='Errore nella lettura dei dati.' } }
        results.push({type:'tool_result',tool_use_id:b.id,content:typeof out==='string'?out:JSON.stringify(out)});
      }
      AI.msgs.push({role:'user',content:results});
    }
  }catch(e){ AI.error=e.message||String(e); const last=AI.msgs[AI.msgs.length-1]; if(last&&last.role==='assistant'&&Array.isArray(last.content)&&last.content.some(b=>b.type==='tool_use')) AI.msgs.pop(); if(AI.msgs.length&&AI.msgs[AI.msgs.length-1].role==='user'&&!AI.msgs[AI.msgs.length-1].content.some(b=>b.type==='tool_result')){ const u=AI.msgs.pop(); AI.draft=u.content.filter(b=>b.type==='text').map(b=>b.text).join('\n') } }

}
function mdLite(t){ // markdown essenziale → HTML sicuro
  const lines=esc(t).split('\n'); let h='', inUl=false;
  for(let l of lines){ l=l.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/(^|\s)\*(\S[^*]*?)\*(?=\s|$|[.,;:!?])/g,'$1<i>$2</i>');
    const li=/^\s*(?:[-•*]|\d+[.)])\s+(.*)/.exec(l);
    if(li){ if(!inUl){ h+='<ul>'; inUl=true } h+=`<li>${li[1]}</li>`; continue }
    if(inUl){ h+='</ul>'; inUl=false }
    const hd=/^#{1,4}\s+(.*)/.exec(l); if(hd){ h+=`<p><b>${hd[1]}</b></p>`; continue }
    if(l.trim()) h+=`<p>${l}</p>` }
  return h+(inUl?'</ul>':'');
}

  const ro=document.getElementById('repOn'); if(ro) ro.onchange=()=>{ lsSet('reeflog.aicfg',JSON.stringify(Object.assign(aiCfg(),{report:ro.checked}))); toast(ro.checked?'Report settimanale attivato':'Report settimanale disattivato'); render(); scheduleNotif(); if(ro.checked) checkReport() };
  const rd=document.getElementById('repDay'); if(rd) rd.onchange=()=>{ lsSet('reeflog.aicfg',JSON.stringify(Object.assign(aiCfg(),{reportDay:+rd.value}))); render(); scheduleNotif() };
  const tp=document.getElementById('testPhotoBtn'); if(tp) tp.onclick=()=>document.getElementById('testPhotoIn').click();
  const sp=document.getElementById('lvAiBtn'); if(sp) sp.onclick=async()=>{ let blob=lvPendingPhoto&&lvPendingPhoto.blob; if(!blob&&lvEdit&&lvEdit.photo){ const r=await getPhoto(lvEdit.photo); blob=r&&r.blob } if(!blob){ toast('Aggiungi prima una foto'); return }
    sp.disabled=true; sp.textContent='Riconosco…'; const keep=lvFormSnapshot();
    try{ const j=await recognizeSpecies(blob); render(); lvFormRestore(Object.assign(keep,{name:j.name||keep.name,species:j.species||keep.species,cat:LV_CAT[j.cat]?j.cat:keep.cat,note:[keep.note,j.note].filter(Boolean).join(' · ').slice(0,300)})); toast(`Riconosciuto (affidabilità ${j.confidence||'?'}): controlla e salva`) }
    catch(e){ render(); lvFormRestore(keep); toast(e.message) } };
}

 {id:'test',i:'🧪',t:'Test e parametri',b:`<p>In <b>Parametri → Nuovo test</b> compila solo i valori che hai misurato. Gli altri lasciali vuoti: non contano come zero. Il segnaposto grigio mostra l'ultimo valore. Puoi usare la virgola.</p>

 {id:'triade',i:'💧',t:'Triade e dosaggio',b:`<p>In <b>Impostazioni</b>, nei riquadri All In One e Balling, puoi scegliere il <b>prodotto dal catalogo</b>: i valori si compilano da soli, con la fonte indicata. Se il tuo prodotto non c'è, scegli <b>Altro</b>, scrivi marca e nome e inserisci i valori dell'etichetta.</p>

  <p><b>Registra ogni variazione</b> della dose giornaliera con "Imposta nuova dose": l'app calcola quanto hai dosato nel tempo. Le aggiunte una tantum si registrano invece come "Dose manuale" con il ＋.</p>
  <p><b>Come si calcola il consumo</b>: tra due test consecutivi, consumo = valore iniziale + quanto hai dosato + effetto dei cambi d'acqua − valore finale, diviso per i giorni. In Home vedi la media degli ultimi 30 giorni; "Bilancio tra test" mostra il dettaglio.</p>
  <p><b>Dose suggerita</b>: la dose giornaliera che compensa il consumo misurato. Con l'All In One è calcolata sul KH, e l'app ti avvisa se calcio o magnesio tenderebbero a salire o a calare.</p>

 {id:'manut',i:'🔧',t:'Manutenzione e scadenze',b:`<p>In <b>Menu → Manutenzione</b> crei le scadenze ricorrenti:</p>

  <p>Le notifiche arrivano anche ad app chiusa. Usa "Invia una notifica di prova" per controllare.</p>

 {id:'avvio',i:'🌱',t:'Avvio e maturazione',b:`<p>In <b>Impostazioni → Avvio e manutenzione</b> scegli come seguire la partenza della vasca:</p>

 {id:'osmosi',i:'🚰',t:'Impianto osmosi',b:`<p>In <b>Menu → Osmosi</b> registri il <b>TDS</b> dell'acqua in uscita, misurato in ppm con la penna: 0 è perfetto (verde), 1–2 è accettabile (giallo). Alla soglia impostata, 3 ppm se non la cambi, compare l'avviso di cambiare le resine.</p>

 {id:'animali',i:'🐠',t:'Animali e coralli',b:`<p>In <b>Vasca → Animali e coralli</b> crei una scheda per ogni abitante, con foto, nome, specie, categoria, data di inserimento, provenienza, prezzo <b>totale</b> e quantità.</p>

 {id:'foto',i:'📷',t:'Foto dei progressi',b:`<p>Aggiungi le foto dal ＋ o da <b>Vasca → Foto</b>. Vengono ridotte per occupare poco spazio. Tocca una foto per vederla grande, scorri per passare alle altre, aggiungi una nota o correggi la data.</p>

 {id:'backup',i:'💾',t:'Backup e cambio telefono',b:`<p>I dati sono salvati <b>sul telefono</b>. Il modo più comodo per proteggerli è il <b>backup su Google Drive</b>, in <b>Menu → Backup</b>: premi <b>Collega Google Drive</b>, scegli il tuo account e da lì in poi l'app salva dati e foto una volta al giorno, se ci sono novità. Il backup finisce in una cartella nascosta del tuo Drive che vede solo Reef Log, quindi non ingombra i tuoi file.</p>
  <p>Su un telefono nuovo installi Reef Log, vai in <b>Menu → Backup</b> e premi <b>Ho già un backup: ripristina</b> con lo stesso account. I dati del nuovo telefono vengono sostituiti da quelli del backup.</p>

  <p>Puoi anche usare i file:</p>

  <p><b>Per cambiare telefono</b>: esporta dal vecchio e importa nel nuovo. <b>Non disinstallare l'app</b> senza un backup: la disinstallazione cancella i dati. Gli aggiornamenti dell'app invece li conservano.</p>`},
 {id:'ai',i:'✨',t:'Assistente AI (Pro)',b:`<p>L'assistente è una chat che <b>conosce la tua vasca</b>: legge test, consumi, dosi, cambi d'acqua, scadenze e animali, e risponde sui tuoi numeri. Lo apri da <b>Menu → Assistente AI</b>, dal riquadro del dosaggio in Home o da una foto aperta (<b>✨ Analizza</b>).</p>
  <ul><li>Domande libere, per esempio "Perché il KH scende?" o "Posso inserire un nuovo corallo?".</li><li><b>Foto</b>: allega una foto con 📷 per un parere su alghe, cyano, dinoflagellati o coralli. Una foto non basta per una diagnosi certa.</li><li><b>Azioni</b>: l'assistente può proporre di aggiungere una nota, una scadenza, un test letto da una foto o una nuova dose. Non fa nulla senza il tuo <b>Conferma</b>.</li></ul>
  <p><b>Altre funzioni Pro</b>: in Parametri → Nuovo test, <b>✨ Leggi da foto</b> compila il modulo dalla foto del display del checker, della provetta o di un referto (controlla sempre i valori prima di salvare). Nella scheda di un animale, <b>✨ Riconosci dalla foto</b> propone nome, specie e note di compatibilità. Il <b>report settimanale</b> si attiva in Impostazioni: ogni settimana, nel giorno scelto, all'apertura dell'app viene preparato un riepilogo che trovi in Home e in Menu.</p>
  <p>Le risposte possono contenere errori: verifica sempre prima di intervenire. È una funzione del piano Pro; quando la usi, i dati della vasca vengono inviati al fornitore dell'AI solo per elaborare la risposta.</p>`},
 {id:'scorte',i:'📦',t:'Scorte e consumabili',b:`<p>In <b>Menu → Scorte e consumabili</b> registri i prodotti con la quantità attuale. L'app la fa scendere da sola:</p>
  <ul><li><b>All In One e Balling</b>: in base alle dosi registrate;</li><li><b>Sale</b>: in base ai litri dei cambi d'acqua (grammi per litro impostabili, predefinito 36);</li><li><b>Reagenti</b>: un test in meno per ogni misura di quel parametro;</li><li><b>Altro</b> (carbone, resine, calze filtranti…): scegli l'unità di misura (pz, ml, L, g, kg, mg) e, se vuoi, collega una manutenzione con la quantità usata ogni volta. Ad esempio carbone, 100 ml a ogni «Cambio carbone» ogni 30 giorni: quando segni il cambio come fatto, la scorta scende da sola. Se non lo colleghi, usa <b>Ho usato…</b> per scalare a mano.</li></ul>
  <p>Vedi quanto resta e per quanti giorni basta al ritmo attuale. Quando un prodotto sta finendo (meno di 7 giorni) o scade a breve, compare in Home tra le cose da fare. Con <b>Nuova confezione</b> riporti la quantità al pieno.</p>`},
 {id:'attrezzatura',i:'🔌',t:'Attrezzatura',b:`<p>In <b>Menu → Attrezzatura</b> tieni l'elenco degli apparecchi: tipo, marca e modello, data e prezzo d'acquisto, garanzia e note. Con <b>+ Manutenzione</b> colleghi all'apparecchio una scadenza che hai già (così non crei doppioni) oppure ne crei una nuova scegliendo ogni quanti giorni. Le scadenze collegate si modificano (✎) o si scollegano dalla scheda, e restano in Manutenzione; le notifiche si scelgono in Impostazioni → Notifiche.</p>`},
 {id:'pdf',i:'📄',t:'Report PDF',b:`<p>In <b>Menu → Report PDF</b> scegli il periodo (30 giorni, 3 mesi, 1 anno o tutto) e premi <b>Crea il report PDF</b>. Il documento contiene i dati della vasca, gli ultimi valori con il confronto ai range, i grafici dei parametri, i consumi della triade, le variazioni di dosaggio, i cambi d'acqua, le manutenzioni e gli animali.</p>
  <p>Il PDF si crea sul telefono, senza inviare dati, e si condivide da Android: WhatsApp, email, Drive o un forum.</p>`},
 {id:'widget',i:'📱',t:'Widget (Pro)',b:`<p>Con il piano Pro puoi mettere Reef Log sulla schermata Home del telefono: tieni premuto su uno spazio vuoto, scegli <b>Widget</b>, cerca <b>Reef Log</b> e trascinalo dove vuoi.</p>
  <p>Il widget mostra gli ultimi KH, calcio e magnesio (verdi se nel range, gialli o rossi se no), da quanto non fai un test e la prossima manutenzione. Si aggiorna quando usi l'app e ogni mezz'ora; toccandolo apri Reef Log.</p>`},
 {id:'vasche',i:'🐠',t:'Più vasche (Pro)',b:`<p>Con il piano Pro puoi gestire <b>più vasche</b>, per esempio la principale, una quarantena o un nano. Tocca il <b>nome della vasca</b> in alto a sinistra per passare da una all'altra, aggiungerne una nuova, rinominarla (✎) o eliminarla (🗑, due tocchi).</p>
  <p>Ogni vasca ha i suoi dati: test, dosaggio, scadenze, animali, foto, impostazioni e conversazione con l'assistente. Le <b>notifiche</b> arrivano per tutte le vasche, con il nome della vasca nel titolo.</p>
  <p>Il <b>backup</b> esporta la vasca aperta in quel momento; per salvarle tutte esportale una alla volta. La vasca principale non si può eliminare.</p>`},
 {id:'faq',i:'❓',t:'Domande frequenti',b:`<p><b>Il consumo mostra "–".</b> Servono almeno due test dello stesso parametro e la concentrazione del prodotto inserita in Impostazioni.</p>
  <p><b>Il consumo sembra sbagliato.</b> Controlla il volume netto, di aver registrato ogni cambio di dose e i cambi d'acqua, e i dati del prodotto. I test fatti a poche ore di distanza amplificano gli errori del kit: meglio almeno un giorno di distanza.</p>
  <p><b>Ho sbagliato un test.</b> Parametri → Storico → ✎.</p>
  <p><b>Non vedo un parametro in Home o nei grafici.</b> Spuntalo in Impostazioni → Range obiettivo.</p>
  <p><b>Le notifiche non arrivano.</b> Vedi <a data-g="notifiche">Notifiche</a>: permesso e risparmio energetico.</p>
  <p><b>Ho cambiato telefono.</b> Vedi <a data-g="backup">Backup e cambio telefono</a>.</p>`},
];
const HELP_FOR={pdf:'pdf',scorte:'scorte',attrezzatura:'attrezzatura',report:'ai',ai:'ai',home:'home',param:'test',vasca:'animali',menu:'navigazione',dosi:'triade',manut:'manut',osmosi:'osmosi',diario:'diario',impostazioni:'primi',sync:'backup',guida:''};
let guideQ='';
function vGuida(){
  const cur=GUIDE.find(c=>c.id===sub);
  if(cur){ const i=GUIDE.indexOf(cur), prev=GUIDE[i-1], next=GUIDE[i+1];
    return `<div class="card guide"><h2 style="font-size:16px;text-transform:none;letter-spacing:0;color:var(--tx)">${cur.i} ${cur.t}</h2>${cur.b}</div>
      <div class="row" style="justify-content:space-between">${prev?`<button class="btn sm sec" data-go="guida-${prev.id}">‹ ${prev.t}</button>`:'<span></span>'}${next?`<button class="btn sm sec" data-go="guida-${next.id}">${next.t} ›</button>`:''}</div>
      <div style="text-align:center;margin-top:10px"><button class="btn sm sec" data-go="guida">Tutti i capitoli</button></div>`; }
  const q=guideQ.trim().toLowerCase(), strip=h=>h.replace(/<[^>]+>/g,' ');
  const L=GUIDE.filter(c=>!q||(c.t+' '+strip(c.b)).toLowerCase().includes(q));
  return `<div class="card"><input id="gQ" placeholder="Cerca nella guida (es. consumo, TDS, backup)" value="${esc(guideQ)}"></div>`+
    (L.length?L.map(c=>`<div class="mitem" data-go="guida-${c.id}"><i>${c.i}</i><div class="t"><b>${c.t}</b>${q?`<span>${esc(snip(strip(c.b),q))}</span>`:''}</div><span class="mut">›</span></div>`).join(''):`<div class="card small mut">Nessun risultato per "${esc(guideQ)}".</div>`);
}
function snip(t,q){ t=t.replace(/\s+/g,' '); const i=t.toLowerCase().indexOf(q); if(i<0) return ''; return (i>30?'…':'')+t.slice(Math.max(0,i-30),i+60)+'…' }
function bindGuida(){
  const app=document.getElementById('app');
  app.querySelectorAll('.guide a[data-g]').forEach(a=>{ a.href='#'; a.style.color='var(--acc)'; a.onclick=e=>{ e.preventDefault(); go('guida-'+a.dataset.g) } });
  const q=document.getElementById('gQ'); if(q){ q.oninput=()=>{ guideQ=q.value; const pos=q.selectionStart; render(); const n=document.getElementById('gQ'); if(n){ n.focus(); n.setSelectionRange(pos,pos) } } }
}
document.getElementById('helpBtn').onclick=()=>{ const ch= view==='vasca'&&sub==='foto'?'foto' : HELP_FOR[view]; go(ch?'guida-'+ch:'guida') };

/* ---------- Notifiche (app Android) ---------- */
function LNp(){ const C=CAP(); return C&&((C.Plugins&&C.Plugins.LocalNotifications)||(C.registerPlugin&&C.registerPlugin('LocalNotifications'))) }
function notifOn(){ return !!S.settings.notifOn }
function notifTime(){ const m=/^(\d{1,2}):(\d{2})$/.exec(S.settings.notifTime||'09:00'); return m?[+m[1],+m[2]]:[9,0] }
function atTime(dayTs){ const [hh,mm]=notifTime(); const d=new Date(dayTs); d.setHours(hh,mm,0,0); return d.getTime() }
function notifPlan(){
  // elenco delle notifiche da programmare per le prossime settimane
  const out=[], now=Date.now(), until=addDays(day0(now),45);
  if(!notifOn()) return out;

        if(before){ const tb=atTime(addDays(due,-1)); if(tb>now) out.push({ts:tb,title:`Domani: ${t.name}`,body:`Promemoria per domani${extra}`,task:t.id}) }
        if(overdue&&k===0){ const nd=nextDue(Object.assign(clone(tt),{lastDone:due+12*3600000})); for(let j=1;j<=6;j++){ const tr=atTime(addDays(due,j)); if(tr>=atTime(nd)) break; if(tr>now) out.push({ts:tr,title:`⚠️ ${t.name}`,body:`Non ancora segnata come fatta (${j} giorn${j===1?'o':'i'} di ritardo)${extra}`,task:t.id,ifNotDone:true}) } }
      }
      if(dd<0) break;

  if(S.settings.notifStock){ const now2=Date.now();
    for(const it of (S.stock||[])){ const i=stockInfo(it);
      if(i.days!=null){ const when=Math.max(day0(now2),day0(now2+(i.days-7)*DAY)); const ts=atTime(when)>now2?atTime(when):atTime(addDays(day0(now2),1)); if(i.days<60) out.push({ts,title:`📦 ${it.name} sta finendo`,body:`Ne resta per circa ${fmt(Math.max(0,i.days-(ts-now2)/DAY),0)} giorni`,task:'stock'}) }
      if(i.expDays!=null&&i.expDays>=0){ const ts=atTime(addDays(day0(num(it.expiry)),-7)); if(ts>now2) out.push({ts,title:`📦 ${it.name} scade tra 7 giorni`,body:`Scadenza: ${fdate(num(it.expiry),true)}`,task:'stock'}) }
    } }
  return out.sort((a,b)=>a.ts-b.ts).slice(0,60);
}

async function rescheduleNotif(){

    const plan=[], ct=curTank(), list=MULTI&&isPro()?tanks():[{id:ct,name:tankName(ct)}], keep={settings:S.settings,tasks:S.tasks,stock:S.stock};
    for(const tk of list){

    }

    plan.sort((a,b)=>a.ts-b.ts); plan.splice(60);
    if(!plan.length) return;
    await LN.schedule({notifications:plan.map((n,i)=>({id:i+1,title:n.title,body:n.body,schedule:{at:new Date(n.ts),allowWhileIdle:true},channelId:'scadenze',smallIcon:'ic_stat_reef',iconColor:'#2ec4d6',extra:{task:n.task,tank:n.tank}}))});

function enqueueMissing(seen){
  for(const c of COLLS) for(const it of S[c]) if(!seen.has(c+':'+it.id)) Q[c+':'+it.id]='put';
  for(const p of allPhotoMetas()) if(!seen.has('photos:'+p.id)) Q['photos:'+p.id]='put';
  if(!seen.has('settings:main')) Q['settings:main']='put';
  saveQ();
}
function itemData(coll,id){ if(coll==='settings') return clone(S.settings); const it=(S[coll]||[]).find(x=>x.id===id); return it?clone(it):null }
async function push(){
  const keys=Object.keys(Q); if(!keys.length) return;
  const rows=[], done=[];
  for(const k of keys){ const i=k.indexOf(':'), coll=k.slice(0,i), id=k.slice(i+1), op=Q[k];
    if(coll==='photos'){
      const path=`${sbUser.id}/${id}.jpg`;
      if(op==='put'){ const r=await getPhoto(id);
        if(r&&r.blob){ const up=await sb.storage.from('photos').upload(path,r.blob,{upsert:true,contentType:'image/jpeg'}); if(up.error) throw up.error;
          const {error}=await sb.from('items').upsert({user_id:sbUser.id,coll,id,data:{id,ts:r.ts,note:r.note||'',thumb:r.thumb,lv:r.lv||null},deleted:false},{onConflict:'user_id,coll,id'}); if(error) throw error }
      }else{ await sb.storage.from('photos').remove([path]);
        const {error}=await sb.from('items').upsert({user_id:sbUser.id,coll,id,data:null,deleted:true},{onConflict:'user_id,coll,id'}); if(error) throw error }
      delete Q[k]; saveQ(); updHdr(); continue;
    }
    const data= op==='put'? itemData(coll,id) : null;
    if(op==='put'&&!data){ done.push(k); continue }
    rows.push({user_id:sbUser.id,coll,id,data,deleted:op==='del'}); done.push(k);
  }
  for(let i=0;i<rows.length;i+=200){ const {error}=await sb.from('items').upsert(rows.slice(i,i+200),{onConflict:'user_id,coll,id'}); if(error) throw error }
  for(const k of done) if(Q[k]!==undefined) delete Q[k]; saveQ();
}
async function pull(){
  let cur=''; try{ cur=localStorage.getItem('reeflog.cursor')||'' }catch(e){}
  const from = cur? new Date(new Date(cur).getTime()-60000).toISOString() : '1970-01-01T00:00:00Z';
  let maxTs=cur, changed=false, photosChanged=false; const seen=new Set();
  for(let page=0;page<50;page++){
    const {data,error}=await sb.from('items').select('coll,id,data,deleted,updated_at').gt('updated_at',from).order('updated_at',{ascending:true}).range(page*1000,page*1000+999);
    if(error) throw error;
    for(const r of data){
      if(!maxTs||r.updated_at>maxTs) maxTs=r.updated_at; seen.add(r.coll+':'+r.id);
      if(Q[r.coll+':'+r.id]!==undefined) continue; // modifica locale non ancora inviata: vince quella
      if(r.coll==='settings'){ if(!r.deleted&&r.data&&JSON.stringify(r.data)!==JSON.stringify(S.settings)){ S.settings=Object.assign(clone(DEF_SETTINGS),r.data); changed=true } continue }
      if(r.coll==='photos'){
        const ex=await getPhoto(r.id);
        if(r.deleted){ if(ex){ await delPhoto(r.id,true); photosChanged=true } continue }
        if(!ex){ const dl=await sb.storage.from('photos').download(`${sbUser.id}/${r.id}.jpg`); if(dl.error||!dl.data) continue; await putPhoto({id:r.id,ts:r.data.ts,note:r.data.note||'',thumb:r.data.thumb,lv:r.data.lv||null,blob:dl.data},true); photosChanged=true }
        else if(ex.ts!==r.data.ts||(ex.note||'')!==(r.data.note||'')){ ex.ts=r.data.ts; ex.note=r.data.note||''; await putPhoto(ex,true); photosChanged=true }
        continue;
      }
      if(!S[r.coll]||!Array.isArray(S[r.coll])) continue;
      const arr=S[r.coll], i=arr.findIndex(x=>x.id===r.id);
      if(r.deleted){ if(i>=0){ arr.splice(i,1); changed=true } }
      else if(r.data){ if(i<0){ arr.push(r.data); changed=true } else if(JSON.stringify(arr[i])!==JSON.stringify(r.data)){ arr[i]=r.data; changed=true } }
    }
    if(data.length<1000) break;
  }
  if(maxTs) try{ localStorage.setItem('reeflog.cursor',maxTs) }catch(e){}
  if(changed) lsSave();
  if(photosChanged) await loadPhotos();
  if(changed||photosChanged) scheduleRender();
  return seen;
}
async function sync(){
  if(!sb||!sbUser||!navigator.onLine){ updHdr(); return }
  if(syncing){ syncAgain=true; return }
  syncing=true; syncErr=''; updHdr();
  try{
    if(needFull()){ const seen=await pull(); enqueueMissing(seen); await push(); try{ localStorage.setItem('reeflog.syncUser',sbUser.id) }catch(e){} }
    else { await push(); await pull() }
    try{ localStorage.setItem('reeflog.lastSync',Date.now()) }catch(e){} }
  catch(e){ syncErr=(e&&e.message)||'errore'; console.warn('sync',e) }
  finally{ syncing=false; updHdr(); if(view==='set'&&!isTyping()) scheduleRender(); if(syncAgain){ syncAgain=false; scheduleSync(500) } }
}

    f.onsubmit=async e=>{ e.preventDefault(); const o=formVals(f); msg('Accesso…');

      if(error) msg(/confirm/i.test(error.message)?'Devi prima confermare l\'email: controlla la posta.':/invalid/i.test(error.message)?'Email o password errate.':error.message); else { toast('Accesso effettuato'); render() } };

function balTxt(p,d){ // bilancio apporto-consumo
  if(d==null) return '<span class="mut">–</span>';
  const tol=p==='kh'?0.05:p==='ca'?0.5:1.5;
  if(Math.abs(d)<=tol) return '<span style="color:var(--ok)">in equilibrio</span>';
  return d>0?`<span style="color:var(--warn)">+${fmt(d,p==='kh'?2:1)} accumulo</span>`:`<span style="color:var(--bad)">${fmt(d,p==='kh'?2:1)} in calo</span>`;
}
function homeDosing(){
  const mode=dmode(), V=vol(), now=Date.now();
  if(mode==='balling'){
    let h=`<div class="card"><h2>Triade · Balling</h2><div class="tri"><div></div><div class="h">Dose attuale</div><div class="h">Consumo/g</div><div class="h">Dose suggerita</div>`;
    for(const p of TRI){ const eff=effPerMl(p), cons=avgCons(p), r=rateAt(p,now); const sugg=(cons!=null&&eff)?Math.max(0,cons*V/eff):null;
      h+=`<div><span class="dot" style="background:${TRI_COL[p]}"></span><b>${P[p].n}</b></div><div class="big">${fmt(r,1)} <small class="mut">ml/g</small></div>
        <div>${cons!=null?`${fmt(cons,p==='kh'?2:1)} <small class="mut">${P[p].u}</small>`:'<span class="mut">–</span>'}</div>
        <div>${sugg!=null?`<b>${fmt(sugg,1)}</b> <small class="mut">ml/g</small>`:'<span class="mut">–</span>'}</div>` }
    return h+`</div>`;
  }
  const reg=curReg(now);
  if(mode==='aio'){
    const dose=reg&&reg.kind==='aio'?num(reg.aio)||0:0, consKh=avgCons('kh'), eKh=aioEff('kh');
    const sugg=(consKh!=null&&eKh)?Math.max(0,consKh*V/eKh):null;
    let h=`<div class="card"><h2>Dosaggio · All In One</h2>
      <div class="row" style="gap:18px"><div><div class="small mut">Dose attuale</div><div class="big" style="font-size:22px">${fmt(dose,1)} <small class="mut">ml/g</small></div></div>
      <div><div class="small mut">Dose consigliata</div><div class="big" style="font-size:22px">${sugg!=null?fmt(sugg,1)+' <small class="mut">ml/g</small>':'–'}</div><div class="small mut">calcolata sul consumo di KH</div></div></div>
      <div class="tri" style="margin-top:12px;grid-template-columns:auto 1fr 1fr 1.2fr"><div></div><div class="h">Consumo/g</div><div class="h">Apporto/g</div><div class="h">Bilancio</div>`;
    for(const p of TRI){ const c=avgCons(p), e=aioEff(p), ap=e?dose*e/V:null;
      h+=`<div><span class="dot" style="background:${TRI_COL[p]}"></span><b>${P[p].n}</b></div><div>${c!=null?fmt(c,p==='kh'?2:1):'–'}</div><div>${ap!=null?fmt(ap,p==='kh'?2:1):'–'}</div><div class="small">${balTxt(p,(c!=null&&ap!=null)?ap-c:null)}</div>` }
    h+=`</div>`;
    if(!eKh||!aioEff('ca')||!aioEff('mg')) h+=`<hr><div class="small mut">Inserisci i dati dell'etichetta del prodotto in <a href="#" data-go="impostazioni" style="color:var(--acc)">Impostazioni</a>.</div>`;
    const l=lastVal('kh'); if(l&&eKh){ const [lo,hi]=tgt('kh'), mid=(lo+hi)/2; if(l.v<lo){ const ml=(mid-l.v)*V/eKh; const side=['ca','mg'].filter(p=>aioEff(p)).map(p=>`${P[p].n} +${fmt(ml*aioEff(p)/V,0)} ppm`).join(', ');
      h+=`<hr><div class="small">KH ${fmt(l.v,2)} sotto target → circa <b>${fmt(ml,0)} ml di AIO</b> una tantum per arrivare a ${fmt(mid,2)}${side?` <span class="mut">(alza anche ${side})</span>`:''}${(mid-l.v)>1?` <span class="mut">· dividi in ${Math.ceil(mid-l.v)} giorni</span>`:''}</div>` } }
    return h;
  }
  // reattore di calcio
  const flow=reg&&reg.kind==='reactor'?num(reg.flow)||0:0, ek=reg&&reg.kind==='reactor'?num(reg.effKH):null, consKh=avgCons('kh'), tk=valAt('kh',now);
  const sugg=(consKh!=null&&ek!=null&&ek>tk)?consKh*V/(ek-tk)/1.44:null;
  let h=`<div class="card"><h2>Dosaggio · Reattore di calcio</h2>
    <div class="row" style="gap:18px"><div><div class="small mut">Portata effluente</div><div class="big" style="font-size:22px">${fmt(flow,1)} <small class="mut">ml/min</small></div></div>
    <div><div class="small mut">KH effluente</div><div class="big" style="font-size:22px">${ek!=null?fmt(ek,1)+' <small class="mut">dKH</small>':'–'}</div></div>
    <div><div class="small mut">Portata consigliata</div><div class="big" style="font-size:22px">${sugg!=null?fmt(sugg,1)+' <small class="mut">ml/min</small>':'–'}</div></div></div>
    <div class="tri" style="margin-top:12px;grid-template-columns:auto 1fr 1fr 1.2fr"><div></div><div class="h">Consumo/g</div><div class="h">Apporto/g</div><div class="h">Bilancio</div>`;
  for(const p of TRI){ const c=avgCons(p), a=reg&&reg.kind==='reactor'?reactorAdd(reg,p,now):null, ap=a!=null?a/V:null;
    h+=`<div><span class="dot" style="background:${TRI_COL[p]}"></span><b>${P[p].n}</b></div><div>${c!=null?fmt(c,p==='kh'?2:1):'–'}</div><div>${ap!=null?fmt(ap,p==='kh'?2:1):'–'}</div><div class="small">${balTxt(p,(c!=null&&ap!=null)?ap-c:null)}</div>` }
  h+=`</div>`;
  if(!reg||reg.kind!=='reactor') h+=`<hr><div class="small mut">Registra portata e KH dell'effluente in <a href="#" data-go="dosi" style="color:var(--acc)">Dosaggio</a>.</div>`;
  else if(reg.effCa==null) h+=`<div class="small mut" style="margin-top:6px">Apporto di calcio stimato dal KH dell'effluente (${fmt(CA_PER_DKH,1)} ppm per dKH): misura il Ca dell'effluente per un dato più preciso.</div>`;
  return h;
}

  h+=`</div></div>`;

    for(const x of I) h+=`<div class="it"><div class="when">${fdate(x.t1)}→${fdate(x.t2)}</div><div class="body">${fmt(x.c1,P[p].d)} → ${fmt(x.c2,P[p].d)} · ${isReactor()&&p!=='mg'?`effluente ${fmt(x.ml,0)} L`:`dosati ${fmt(x.ml,0)} ml`}${x.added!=null?` (+${fmt(x.added,P[p].d+1)})`:''}${x.wc?` · cambi ${x.wc>0?'+':''}${fmt(x.wc,P[p].d+1)}`:''}<br>Consumo: <b>${x.cons!=null?fmt(x.cons,p==='kh'?2:1)+' '+P[p].u+'/g':'–'}</b></div></div>`;
    h+=`</div>`;
  }
  if(!TRI.some(p=>intervals(p).length)) h+=`<p class="mut small">Servono almeno due test dello stesso parametro.</p>`;
  return h+`</div>`;
}

const AX={ticks:{color:'#8aa7b6',font:{size:11}},grid:{color:'#1f415355'}};
function xTime(min,max){ return {type:'linear',min,max,ticks:{...AX.ticks,maxTicksLimit:6,callback:v=>fdate(v)},grid:AX.grid} }
function rangeFrom(){ return grafRange? Date.now()-grafRange*DAY : null }
function drawCharts(){
  if(!window.Chart){ document.querySelectorAll('canvas').forEach(c=>c.outerHTML='<p class="mut small">Grafici non disponibili (libreria non caricata, controlla la connessione).</p>'); return }
  Chart.defaults.color='#8aa7b6'; Chart.defaults.locale='it-IT';
  const from=rangeFrom(), to=Date.now();
  const xmin0 = from ?? Math.min(to-30*DAY, ...S.tests.map(t=>t.ts));
  const xmin = xmin0;
  for(const p of shownParams()){
    const el=document.getElementById('cv_'+p); if(!el) continue;
    const pts=testsWith(p).filter(t=>!from||t.ts>=from).map(t=>({x:t.ts,y:num(t.v[p])})); const [lo,hi]=tgt(p);
    charts['v_'+p]=new Chart(el,{type:'line',data:{datasets:[
      {label:P[p].n,data:pts,borderColor:'#2ec4d6',backgroundColor:'#2ec4d6',pointRadius:3.5,tension:.25,borderWidth:2},
      {label:'min',data:[{x:xmin,y:lo},{x:to,y:lo}],borderColor:'#3fcf8e88',borderDash:[5,4],pointRadius:0,borderWidth:1.2},
      {label:'max',data:[{x:xmin,y:hi},{x:to,y:hi}],borderColor:'#3fcf8e88',borderDash:[5,4],pointRadius:0,borderWidth:1.2,fill:'-1',backgroundColor:'#3fcf8e12'}
    ]},options:{animation:false,plugins:{legend:{display:false},tooltip:{filter:i=>i.datasetIndex===0,callbacks:{title:i=>fdate(i[0].parsed.x,true)}}},scales:{x:xTime(xmin,to),y:AX}}});
  }
  // consumi
  const ds=[]; for(const q of TRI){ const I=intervals(q).filter(x=>x.cons!=null&&(!from||x.t2>=from)); if(!I.length) continue;
    const d=[]; for(const x of I){ d.push({x:x.t1,y:x.cons},{x:x.t2,y:x.cons}) }
    ds.push({label:P[q].n,data:d,borderColor:TRI_COL[q],backgroundColor:TRI_COL[q],pointRadius:0,borderWidth:2,yAxisID:q==='kh'?'y2':'y'}) }
  const c2=document.getElementById('cCons');
  if(c2) charts.cons=new Chart(c2,{type:'line',data:{datasets:ds},options:{animation:false,plugins:{legend:{labels:{boxWidth:12}}},scales:{x:xTime(xmin,to),y:{...AX,title:{display:true,text:'ppm/g'}},y2:{...AX,ticks:{...AX.ticks,callback:v=>fmt(v,2)},grace:'10%',position:'right',grid:{display:false},title:{display:true,text:'dKH/g'}}}}});
  // dosi
  const R=regimens(); const dd=[];
  const keys=[]; if(R.some(r=>r.kind!=='aio'&&r.kind!=='reactor')) keys.push(...TRI); if(R.some(r=>r.kind==='aio')) keys.push('aio'); if(R.some(r=>r.kind==='reactor')) keys.push('flow');
  for(const q of keys){ const d=[]; let prev=null;
    for(const r of R){ const y= q==='aio' ? (r.kind==='aio'?num(r.aio)||0:0) : q==='flow' ? (r.kind==='reactor'?num(r.flow)||0:0) : ((r.kind==='aio'||r.kind==='reactor')?0:num(r[q])||0); if(prev!=null) d.push({x:r.ts,y:prev}); d.push({x:r.ts,y}); prev=y }
    if(prev!=null) d.push({x:to,y:prev});
    dd.push({label:q==='aio'?'All In One':q==='flow'?'Reattore (ml/min)':P[q].n,data:d.filter(z=>!from||z.x>=from-1),borderColor:q==='aio'||q==='flow'?'#2ec4d6':TRI_COL[q],pointRadius:0,borderWidth:2}) }
  const c3=document.getElementById('cDose');
  if(c3) charts.dose=new Chart(c3,{type:'line',data:{datasets:dd},options:{animation:false,plugins:{legend:{labels:{boxWidth:12}}},scales:{x:xTime(xmin,to),y:{...AX,beginAtZero:true}}}});
}

function parseHash(){

  let [v,sb]=hsh.split('-'); if(!VIEWS[v]) v='home';
  if(SUBS[v]){ if(!SUBS[v].some(x=>x[0]===sb)) sb=SUBS[v][0][0] } else if(v==='guida'){ sb=GUIDE.some(c=>c.id===sb)?sb:'' } else sb='';
  return [v,sb];
}
function applyRoute(){
  const [v,sb]=parseHash(); const changed=(v!==view||sb!==sub);

  if(changed){ doneOpen=null; editTask=null; photoSel=null; stockEdit=null; gearEdit=null; gearTaskFor=null; if(v!=='vasca'){ lvEdit=null; lvPendingPhoto=null } }
  const tab= v==='home'?'home': v==='param'?'param': v==='vasca'?'vasca':'menu';
  document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===tab));

document.getElementById('fileIn').onchange=async e=>{
  const f=e.target.files[0]; e.target.value=''; if(!f) return;
  let j; try{ j=JSON.parse(await f.text()) }catch(err){ toast('File non valido'); return }
  if(!j||j.app!=='reeflog'){ toast('Non è un backup Reef Log'); return }
  toast('Importazione in corso…');
  let n=0;
  for(const c of COLLS) for(const it of (j[c]||[])){ if(it&&it.id&&(['tasks','livestock','stock','gear'].includes(c)||isFinite(it.ts))){ if(S.mode==='db'){ try{ await base.collection(c).doc(String(it.id)).set(it); n++ }catch(err){ handleErr(err); return } } else { const a=S[c]; const i=a.findIndex(x=>x.id===it.id); if(i>=0)a[i]=it; else a.push(it); n++ } } }
  let np=0; if(Array.isArray(j.photos)) for(const p of j.photos){ try{ if(!p||!p.id||!p.data) continue; const blob=await (await fetch(p.data)).blob(); await putPhoto({id:p.id,ts:p.ts,note:p.note||'',thumb:p.thumb,lv:p.lv||null,blob}); np++ }catch(err){} }
  if(np){ await loadPhotos(); n+=np }
  S.settings=Object.assign(clone(DEF_SETTINGS),j.settings||S.settings,{welcomed:true}); await saveSettings();
  if(S.mode==='local') lsSave();
  snoozeBackup();
  if(sbUser) enqueueAll();
  toast(`Importati ${n} elementi`); render();
};
