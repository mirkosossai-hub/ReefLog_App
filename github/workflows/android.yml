name: Compila APK Android

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Installa dipendenze
        run: npm install

      - name: Crea il progetto Android
        run: npx cap add android

      - name: Icone e schermata di avvio
        run: cp -r res/* android/app/src/main/res/

      - name: Copia l'app nel progetto
        run: npx cap sync android

      - name: Compila l'APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rinomina
        run: cp android/app/build/outputs/apk/debug/app-debug.apk ReefLog.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ReefLog-apk
          path: ReefLog.apk
