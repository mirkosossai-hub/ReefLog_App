name: Compila APK Android

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Installa dipendenze
        run: npm install

      - name: Crea il progetto Android
        run: npx cap add android

      - name: Icone e schermata di avvio
        run: cp -r res/* android/app/src/main/res/

      - name: Codice nativo (Google Drive e widget)
        run: |
          PKG=android/app/src/main/java/$(node -p "require('./capacitor.config.json').appId.replace(/\./g,'/')")
          mkdir -p $PKG && cp native/*.java $PKG/ && ls $PKG
          python3 native/patch_manifest.py > /dev/null
          grep -n "ReefWidgetProvider\|backup_rules" android/app/src/main/AndroidManifest.xml

      - name: Copia l'app nel progetto
        run: npx cap sync android

      - name: Solo accesso Google (niente Facebook, Apple, Twitter)
        run: |
          printf '\nsocialLogin.google.include=true\nsocialLogin.facebook.include=false\nsocialLogin.apple.include=false\nsocialLogin.twitter.include=false\n' >> android/gradle.properties
          tail -5 android/gradle.properties

      - name: Firma fissa e numero di versione
        run: |
          VN=$(node -p "require('./package.json').version")
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"$VN\"/" android/app/build.gradle
          cat >> android/app/build.gradle <<'GRADLE'

          android {
              signingConfigs {
                  fissa {
                      storeFile rootProject.file('../debug.keystore')
                      storePassword 'android'
                      keyAlias 'androiddebugkey'
                      keyPassword 'android'
                  }
              }
              buildTypes {
                  debug { signingConfig signingConfigs.fissa }
              }
          }
          GRADLE
          grep -n "versionCode\|versionName\|fissa" android/app/build.gradle

      - name: Compila l'APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rinomina e mostra la firma
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk ReefNova.apk
          $ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | sort -V | tail -1)/apksigner verify --print-certs ReefNova.apk | grep -i "SHA-256" || true

      - uses: actions/upload-artifact@v4
        with:
          name: ReefNova-apk
          path: ReefNova.apk
